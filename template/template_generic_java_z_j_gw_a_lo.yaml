zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 83a5ee7554b8414d8a283e40461c33a7
      name: Templates/Applications/Java
  templates:
    - uuid: 76339d3d8dc44bfe8889a48eb3e940be
      template: 'Template App Generic Java Z_J_gw_A_lo'
      name: 'Template App Generic Java Z_J_gw_A_lo'
      description: |
        Generic JVM metrics via z_java_gw_adapter_lo active items (Z_J_gw_A_lo pattern).

        Escaping: zabbix_java_gw_adapter __esc_json JSON-escapes the logical jmx key in the
        gateway message body. That reduces escaped backslashes in item keys from four to two
        (use \\ before each inner " around bean/pattern, not \\\\") — cleaner, easier to organize.
        Agent-layer quoting is still mandatory; see docs/SECURE AUTOMATIC JMX  WITH ZABBIX.md §6.

        Author: Alexander Rydzewski <rydzewski.al@gmail.com>
        https://github.com/AlexRydzewski/zabbix-secure-automatic-jmx

        https://blog.zabbix.com/new-monitoring-possibilities-for-java-applications-in-zabbix-3-4/5972/
        https://www.zabbix.com/documentation/current/en/manual/concepts/java
        Discovery: zabbix_jmx_discovery (well_known_java + custom + any_java bundles)
      groups:
        - name: Templates/Applications/Java
      discovery_rules:
        - uuid: a759f5ea536b4272a6531ddbef01fa58
          name: 'JVM instance discovery'
          type: TRAP
          key: zabbix.jmx.jvm.discovery
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            JVM instances from zabbix_jmx_discovery TRAP (zabbix.jmx.jvm.discovery).
            Item prototypes: z_java_gw_adapter_lo — __esc_json in adapter; \\ before inner " in keys (§6).
          item_prototypes:
            - uuid: 738dbd156cf54fdca950f61926c6c264
              name: '{#SERVERID},{#APPNAME}: cl Loaded Class Count'
              type: ZABBIX_ACTIVE
              key: 'z_java_gw_adapter_lo[{#JMXPORT},"jmx[java.lang:type=ClassLoading,LoadedClassCount]"]'
              history: 1w
              trends: 4w
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[0].value'
              tags:
                - tag: Application
                  value: JVM
                - tag: Application
                  value: 'JVM:Classes'
                - tag: Application
                  value: '{#APPNAME}'
                - tag: Application
                  value: '{#SERVERID},{#APPNAME}'
