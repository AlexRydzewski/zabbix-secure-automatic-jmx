            - uuid: 65ccff552ced47fb99b58822e20097aa
              expression: 'last(/Template App Generic Java Z_J_gw_A_lo/z_java_gw_adapter_lo[{#JMXPORT},"jmx[java.lang:type=Memory,HeapMemoryUsage.committed]"])=last(/Template App Generic Java Z_J_gw_A_lo/z_java_gw_adapter_lo[{#JMXPORT},"jmx[java.lang:type=Memory,HeapMemoryUsage.max]"])'
              name: '{#SERVERID},{#APPNAME}: mem Heap Memory fully committed'
              priority: WARNING
              description: |
                https://stackoverflow.com/questions/68434657/java-memory-heap-and-non-heap-items
                    Heap Memory, which is the storage for Java objects. The heap is the place in memory where your dynamically allocated objects live. Java's heap is subject to garbage collection and the objects are usable directly.
                
                https://www.ibm.com/docs/bg/sdk-java-technology/8?topic=sizing-initial-maximum-heap-sizes
                    The Garbage Collector adapts heap size to keep occupancy between 40% and 70% for the following reasons:
                    A heap occupancy greater than 70% causes more frequent GC cycles, which can reduce performance. You can alter this behavior by setting the -Xminf option.
                    A heap occupancy less than 40% means infrequent GC cycles. However, these cycles are longer than necessary, causing longer pause times, which can reduce performance. You can alter this behavior by setting the -Xmaxf option.
                    If you do not set an initial or maximum heap size, the GC expands and shrinks the heap as required. However, if you fix the heap size by using the -Xms and -Xmx options, the GC does not expand or shrink the Java™ heap. To optimize application performance and keep within the 40 - 70% range, the maximum heap size setting should therefore be at least 43% larger than the maximum occupancy of the application.
                    Setting the minimum and maximum heap size to the same value is typically not a good idea because garbage collection is delayed until the heap is full. Therefore, the first time that the GC runs, the process can take longer. Also, the heap is more likely to be fragmented and require a heap compaction. Start your application with the minimum heap size that your application requires. When the GC starts up, it runs frequently and efficiently because the heap is small.
                
                https://docs.oracle.com/javase/8/docs/technotes/guides/vm/gctuning/sizing.html
                    If the value of the -Xms parameter is smaller than the value of the -Xmx parameter, than not all of the space that is reserved is immediately committed to the virtual machine. The uncommitted space is labeled "virtual" in this figure. The different parts of the heap (tenured generation and young generation) can grow to the limit of the virtual space as needed.
                    For the consistent collector setting -Xms and -Xmx to the same value increases predictability by removing the most important sizing decision from the virtual machine. However, the virtual machine is then unable to compensate if you make a poor choice.
              manual_close: 'YES'
            - uuid: 641ef736f64e4e0aad1fc7f96ab679bb
              expression: 'last(/Template App Generic Java Z_J_gw_A_lo/z_java_gw_adapter_lo[{#JMXPORT},"jmx[java.lang:type=Memory,NonHeapMemoryUsage.committed]"])=last(/Template App Generic Java Z_J_gw_A_lo/z_java_gw_adapter_lo[{#JMXPORT},"jmx[java.lang:type=Memory,NonHeapMemoryUsage.max]"])'
