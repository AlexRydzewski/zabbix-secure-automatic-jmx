        - uuid: fb681785f8c44d979d9e04b6579530ef
          name: 'JVM GC discovery'
          type: ZABBIX_ACTIVE
          key: 'z_java_gw_adapter_lo[{#JMXPORT},"jmx.discovery[beans,\\"*:type=GarbageCollector,name=*\\"]"]'
          delay: 1h
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          parent_discovery_rule:
            key: zabbix.jmx.jvm.discovery
          description: |
            Garbage collectors via jmx.discovery through z_java_gw_adapter_lo.
            Item keys: \\ before inner " (adapter __esc_json — four backslashes not needed).
            https://www.zabbix.com/documentation/3.4/en/manual/discovery/low_level_discovery/jmx
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var o = JSON.parse(value);
                  var inner = o.data && o.data[0] && o.data[0].value;
                  if (!inner) return value;
                  if (typeof inner === 'string') {
                    inner = inner.replace(/\\\//g, '/');
                    inner = JSON.parse(inner);
                  }
                  return JSON.stringify(inner);

          item_prototypes:
            - uuid: c2a56d2cbefe478a852f6b519576b631
              name: '{#SERVERID},{#APPNAME}: gc {#JMXNAME} collections count'
