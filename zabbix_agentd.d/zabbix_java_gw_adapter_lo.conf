# Z_J_gw_A_lo: zabbix-agent active checks via local zabbix-java-gateway
# Version: 1.0.0
# zabbix-secure-automatic-jmx — Alexander Rydzewski <rydzewski.al@gmail.com>
# https://github.com/AlexRydzewski/zabbix-secure-automatic-jmx
# https://blog.zabbix.com/new-monitoring-possibilities-for-java-applications-in-zabbix-3-4/5972/
#
# Production: no JMX auth (jmxremote.local.only=true, authenticate=false) — docs/SECURE AUTOMATIC JMX  WITH ZABBIX.md §8
# Optional host-local auth: credentials in a root-only/zabbix-readable Include file — never in Zabbix item keys

#UserParameter=z_java_gw_adapter_lo[*], /usr/local/bin/zabbix_java_gw_adapter localhost $1 "$2" $3 monitor "$(cat /etc/zabbix/jmx-monitor.password)" | sed "s/,\"response\":\"success\"//"

UserParameter=z_java_gw_adapter_lo[*], /usr/local/bin/zabbix_java_gw_adapter localhost $1 "$2" $3 | sed "s/,\"response\":\"success\"//"
